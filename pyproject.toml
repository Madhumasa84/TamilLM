[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamillm-sft-validator"
version = "0.3.0"
description = "Validation and quality reporting for Tamil instruction-tuning datasets"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "TamilLM contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<9.0",
  "pytest-cov>=4.0,<6.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
]

[project.scripts]
tamillm-validate = "validator.cli:main"

[tool.setuptools.packages.find]
include = ["validator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["validator"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["venv", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "tests/"
