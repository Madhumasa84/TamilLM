name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest --cov=validator --cov-report=term-missing
      - name: Validate the checked-in dataset
        run: >-
          python -m validator.cli
          --input data/tamil_sft_seed.jsonl
          --clean outputs/ci-clean.jsonl
          --report outputs/ci-report.json
          --ci-summary

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linting tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Type check
        run: mypy validator
